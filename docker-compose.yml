services:
  postgres:
    image: postgres:15-alpine
    container_name: repoteka-postgres
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: repoteka
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  loader:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: repoteka-loader
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: repoteka
      DB_USER: postgres
      DB_PASSWORD: postgres
      REPOTEKA_URL: https://rdb.altlinux.org/repoteka
    command: ["python3", "-m", "src.cli.main", "load"]
    restart: "no"  # Loader runs once and exits

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: repoteka-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: repoteka
      DB_USER: postgres
      DB_PASSWORD: postgres
      REPOTEKA_URL: https://rdb.altlinux.org/repoteka
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "8000:8000"
    command: ["python3", "-m", "src.cli.main", "serve"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pgdata:
