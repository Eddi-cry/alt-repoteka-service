[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alt-repoteka-service"
version = "1.0.0"
description = "Service for tracking package versions across ALT Linux repositories"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Eddi-cry", email = "eddi@example.com"}
]
keywords = ["alt-linux", "package-management", "repository", "repoteka"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "fastapi>=0.104.1,<0.150.0",
    "uvicorn[standard]>=0.24.0,<1.0.0",
    "sqlalchemy[asyncio]>=2.0.23,<3.0.0",
    "asyncpg>=0.29.0,<1.0.0",
    "aiohttp>=3.9.1,<4.0.0",
    "click>=8.1.7,<9.0.0",
    "pydantic>=2.5.0,<3.0.0",
    "pydantic-settings>=2.1.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "psycopg2-binary>=2.9.9,<3.0.0",
    "greenlet>=3.0.0,<4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
    "pre-commit>=3.3.0",
]
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.24.0",
]

[project.scripts]
repoteka = "src.cli.main:cli"

[project.urls]
Homepage = "https://github.com/Eddi-cry/alt-repoteka-service"
Repository = "https://github.com/Eddi-cry/alt-repoteka-service"
Issues = "https://github.com/Eddi-cry/alt-repoteka-service/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
namespaces = false

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "aiohttp.*",
    "asyncpg.*",
    "click.*",
    "tests.*",
]
ignore_missing_imports = true
ignore_errors = true

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false


[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PIE", "FA", "BLE", "DTZ"]
ignore = [
    "B008",   # FastAPI требует Depends() и Query() именно в аргументах по умолчанию
    "BLE001", # Ловля Exception допустима для верхнеуровневой обработки ошибок в CLI/API
    "DTZ001", # Использование timezone-naive datetime допустимо в рамках этого ТЗ
    "DTZ005",
    "DTZ006",
    "SIM102", # Вложенные if иногда читаются лучше, чем длинные строки с and
    "FA100",  # Добавление __future__ annotations является вкусовщиной
    "E501",   # Black уже контролирует длину строк, двойной контроль избыточен
]
