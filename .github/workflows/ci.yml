name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Можно указать 3.12 или 3.13, если используешь их

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Устанавливаем все dev-зависимости из pyproject.toml (включая ruff, black, mypy, pytest)
          pip install -e ".[dev]"

      - name: Check formatting with Black
        run: black --check .

      - name: Check imports with isort
        run: isort --check-only --diff .

      - name: Lint with Ruff
        run: ruff check .

      - name: Type check with MyPy
        run: mypy src tests

      - name: Run tests with Pytest
        run: pytest tests/ -v --cov=src --cov-report=term-missing
