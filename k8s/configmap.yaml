apiVersion: v1
kind: ConfigMap
metadata:
  name: repoteka-config
  namespace: repoteka
  labels:
    app: repoteka
data:
  # Database configuration
  db_host: "postgres-service"
  db_port: "5432"
  db_name: "repoteka"
  db_user: "postgres"

  # Repoteka API configuration
  repoteka_url: "https://rdb.altlinux.org/repoteka"

  # API server configuration
  api_host: "0.0.0.0"
  api_port: "8000"
